name: Verify SystemC, TLM, and AMS template

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  # Check source formatting and verify the developer scripts.
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-devcontainer
        with:
          commands: |
            ./scripts/check_and_fix/check_and_fix.sh
            ./scripts/test_workflows.sh

  # Compile both build profiles. Add platform or toolchain variants here.
  build:
    name: Build
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-devcontainer
        with:
          commands: ./scripts/build_and_test/build_and_test.sh build --config=ci //...

  # Run the test suite. Add separate integration targets as it grows.
  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-devcontainer
        with:
          commands: ./scripts/build_and_test/build_and_test.sh test --config=ci //...

  # Run instrumented tests and retain the HTML report.
  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-devcontainer
        with:
          commands: |
            ./scripts/check_and_fix/code_coverage.sh --config=ci //...
            git diff --exit-code -- MODULE.bazel.lock
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: bazel-coverage/
          if-no-files-found: error
