name: Run in dev-container
description: Run a CI stage with devcontainer

inputs:
  commands:
    description: Bash commands to run from the repository root
    required: true

runs:
  using: composite
  steps:
    - name: Build development image
      shell: bash
      run: docker build --platform linux/amd64 -t systemc-ams-template .devcontainer
    - name: Run stage commands
      shell: bash
      env:
        STAGE_COMMANDS: ${{ inputs.commands }}
      run: |
        # Bazel needs a username when the runner UID has no passwd entry in the image.
        docker run --rm --user "$(id -u):$(id -g)" -e USER="$(id -un)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:/work" -w /work systemc-ams-template \
          bash -euo pipefail -c "$STAGE_COMMANDS"
